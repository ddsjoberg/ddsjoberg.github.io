# Software listed on software.html.
# Text fields accept `backticks` for inline code; everything else is escaped.
# section: "maintainer", "author" or "contributor" (mirrors github.com/ddsjoberg/pkg-logs)

# ---- Packages I maintain -------------------------------------------------------
- name: gtsummary
  url: https://www.danieldsjoberg.com/gtsummary/
  logo: { file: gtsummary.webp, width: 163, height: 187 }
  languages: [R]
  section: maintainer
  summary: >
    Publication-ready analytic and summary tables in R. Summarize data sets,
    regression models and more, with sensible defaults and highly customizable output.
  details:
    - "**Summarize data frames** for descriptive statistics and demographics (e.g. a Table 1), automatically detecting continuous, categorical and dichotomous variables and reporting missingness."
    - "**Summarize regression models**, including reference rows for categorical variables and pre-filled headers such as Odds Ratio and Hazard Ratio."
    - "**Customize tables** with formatting and styling functions: bold labels, italicize levels, add p-values, merge or stack tables side by side."
    - "**Report statistics inline** in R Markdown and Quarto, keeping reports fully reproducible."
  install: install.packages("gtsummary")

- name: cards
  url: https://pharmaverse.github.io/cards/
  logo: { file: cards.webp, width: 162, height: 186 }
  languages: [R]
  section: maintainer
  summary: >
    Create Analysis Results Datasets (ARDs): a standard, machine-readable record of
    the statistics behind tables and figures. {gtsummary} builds its tables on {cards}.
  install: install.packages("cards")

- name: cardx
  url: https://pharmaverse.github.io/cardx/
  logo: { file: cardx.webp, width: 162, height: 186 }
  languages: [R]
  section: maintainer
  summary: >
    Extra Analysis Results Data utilities that supplement {cards}, putting statistical
    test and model results in the ARD format for tables, figures and reports.
  install: install.packages("cardx")

- name: ggsurvfit
  url: https://www.danieldsjoberg.com/ggsurvfit/
  logo: { file: ggsurvfit.webp, width: 162, height: 186 }
  languages: [R]
  section: maintainer
  summary: >
    Publication-ready time-to-event (survival) figures with ggplot2. Every function is a
    proper ggplot geom or stat, so it combines with any other ggplot customization.
  install: install.packages("ggsurvfit")

- name: Decision Curve Analysis
  url: https://www.danieldsjoberg.com/dca-tutorial/dca-tutorial-r.html
  logo: { file: dca.webp, width: 192, height: 172 }
  languages: [R, Stata, SAS]
  section: maintainer
  summary: >
    Evaluate and compare prediction models by their clinical consequences, using only
    the data set the models are tested on. Includes the {dcurves} R package and a full tutorial.
  links:
    - { text: "dcurves package", url: "https://www.danieldsjoberg.com/dcurves/" }
  install: install.packages("dcurves")

- name: tidycmprsk
  url: https://mskcc-epi-bio.github.io/tidycmprsk/
  logo: { file: tidycmprsk.webp, width: 166, height: 192 }
  languages: [R]
  section: maintainer
  summary: >
    An intuitive interface to competing-risks analysis: cumulative incidence with
    `cuminc()`, competing-risk regression with `crr()`, and broom-style tidiers.
  install: install.packages("tidycmprsk")

- name: starter
  url: https://www.danieldsjoberg.com/starter/
  logo: { file: starter.webp, width: 164, height: 189 }
  languages: [R]
  section: maintainer
  summary: >
    Drop a project skeleton into a new or existing directory, initialize git and create a
    reproducible {renv} environment, with dynamically named files and folders.
  install: install.packages("starter")

- name: updater
  url: https://www.danieldsjoberg.com/updater/
  languages: [R]
  section: maintainer
  summary: >
    Get up and running after an R upgrade: reinstall all your previously installed
    packages with {renv}, replenishing your package cache along the way.
  install: install.packages("updater")

